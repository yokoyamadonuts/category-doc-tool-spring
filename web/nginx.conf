server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        # 既定の 1MB では取り込みが nginx で止まる。上限の判定と 413 の応答は api に任せる
        client_max_body_size 12m;
        proxy_pass http://api:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ファイル名にハッシュが付くので、長くキャッシュしてよい。
    # ないファイルに index.html を返すと、古い画面がモジュールの読み込みに失敗して真っ白になるので 404 にする
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html は毎回確かめさせ、デプロイの後に古いアセットを参照しないようにする
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
